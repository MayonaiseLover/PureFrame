[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pureframe"
version = "0.1.0"
description = "Watch movies and TV episodes with localized explicit visual censorship."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python",
    "opencv-python-headless",
    "scenedetect>=0.6.4",
    "nudenet>=3.4.2",
    "onnxruntime",
    "torch>=2.4",
    "pydantic>=2.0",
    "pydantic-settings",
    "typer",
    "rich",
    "tqdm",
    "numpy",
    "transformers",
    "panns-inference",
    "librosa",
    "platformdirs>=4.9.6",
]
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black"
]

[project.scripts]
pureframe = "pureframe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["pureframe"]
